name: Polymarket Bot

on:
  schedule:
    # Daily paper trade report: 23:00 UTC+8 = 15:00 UTC
    - cron: "0 15 * * *"
    # Daily strategy review: 08:30 Taiwan = 00:30 UTC
    - cron: "30 0 * * *"
    # Intraday scan: every 5 min
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Force send daily report (yes/no)"
        required: false
        default: "no"
      force_review:
        description: "Force strategy review (yes/no)"
        required: false
        default: "no"

# The branch all jobs check out from.  The reviewer also auto-PRs against this branch.
env:
  DEPLOY_BRANCH: claude/polymarket-tradebot-plan-j2tvbf

jobs:

  # ── Job 1: Daily paper trading report (23:00 Taiwan time = 15:00 UTC) ────────
  paper_trade_report:
    name: "Paper Trade + Daily Report"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_report == 'yes') ||
      (github.event_name == 'schedule' &&
       startsWith(github.event.schedule, '0 15'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r polymarket_bot/requirements.txt -q

      - name: Restore paper trade state
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}
          restore-keys: |
            paper-state-v2-

      - name: Run paper trade + send Telegram daily report
        env:
          PAPER_ESTIMATOR: free
          SEND_DAILY_REPORT: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd polymarket_bot
          python run_paper_trade.py

      - name: Save paper trade state
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}

  # ── Job 2: Intraday scan every 5 min ─────────────────────────────────────────
  paper_scan:
    name: "Intraday Paper Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Skip 15:00 UTC (daily report) and 00:30 UTC (strategy review) slots
    if: >
      github.event_name == 'schedule' &&
      !startsWith(github.event.schedule, '0 15') &&
      !startsWith(github.event.schedule, '30 0')

    # Prevent concurrent runs: if a scan is still running when the next 5-min
    # tick fires, queue at most one successor (GitHub drops older queued jobs).
    concurrency:
      group: paper-scan
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r polymarket_bot/requirements.txt -q

      - name: Restore paper trade state
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}
          restore-keys: |
            paper-state-v2-

      - name: Scan markets + alert on new signals
        env:
          PAPER_ESTIMATOR: free
          SEND_DAILY_REPORT: "false"
          MONTHLY_SCAN_LIMIT: ${{ vars.MONTHLY_SCAN_LIMIT || '1200' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd polymarket_bot
          python run_paper_trade.py
          sleep 120
          python run_paper_trade.py

      - name: Save paper trade state
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}

  # ── Job 3: Daily strategy review (00:30 UTC = 08:30 Taiwan) ─────────────────
  strategy_review:
    name: "Daily Strategy Review"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_review == 'yes') ||
      (github.event_name == 'schedule' &&
       startsWith(github.event.schedule, '30 0'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r polymarket_bot/requirements.txt -q

      - name: Restore trade state
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}
          restore-keys: |
            paper-state-v2-

      - name: Run strategy review (auto-tune + Telegram report)
        env:
          REVIEWER_USE_CLAUDE: "true"
          REVIEWER_AUTO_PR: "true"
          REVIEWER_AUTO_MERGE: "true"
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd polymarket_bot
          python reviewer.py

      - name: Save trade state
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}

