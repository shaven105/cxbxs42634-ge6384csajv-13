  #   name: "Live Market Scan"
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 8
  #   concurrency:
  #     group: live-scan
  #     cancel-in-progress: false
  #   if: >
  #     github.event_name == 'schedule' &&
  #     !startsWith(github.event.schedule, '0 15')
  #   steps: ...
