name: Polymarket Bot

on:
  schedule:
    # Daily paper trade report: 23:00 UTC+8 = 15:00 UTC
    - cron: "0 15 * * *"
    # Daily strategy review: 08:30 Taiwan = 00:30 UTC
    - cron: "30 0 * * *"
    # Continuous scan: hourly job that loops internally (~2.5-min cadence when
    # repo is public; single scan when private). Hourly crons fire far more
    # reliably than */5 on the free tier.
    - cron: "3 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Force send daily report (yes/no)"
        required: false
        default: "no"
      force_review:
        description: "Force strategy review (yes/no)"
        required: false
        default: "no"

# The branch all jobs check out from.  The reviewer also auto-PRs against this branch.
env:
  DEPLOY_BRANCH: claude/polymarket-tradebot-plan-j2tvbf

jobs:

  # ── Job 1: Daily paper trading report (23:00 Taiwan time = 15:00 UTC) ────────
  paper_trade_report:
    name: "Paper Trade + Daily Report"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_report == 'yes') ||
      (github.event_name == 'schedule' &&
       startsWith(github.event.schedule, '0 15'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r polymarket_bot/requirements.txt -q

      - name: Restore paper trade state
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}
          restore-keys: |
            paper-state-v2-

      - name: Run paper trade + send Telegram daily report
        env:
          PAPER_ESTIMATOR: free
          SEND_DAILY_REPORT: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd polymarket_bot
          python run_paper_trade.py

      - name: Save paper trade state
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}

      - name: Commit daily performance snapshot to repo
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request, base64
          from datetime import datetime, timezone
          from pathlib import Path

          # Build summary from state files
          def load(p):
              try: return json.loads(Path(p).read_text())
              except: return {}

          sniper = load("polymarket_bot/sniper_trades.json")
          paper  = load("polymarket_bot/paper_trades.json")
          trades = sniper.get("trades", [])
          resolved = [t for t in trades if t.get("resolved")]
          open_t   = [t for t in trades if not t.get("resolved")]
          wins     = sum(1 for t in resolved if t.get("pnl_usdc", 0) > 0)

          summary = {
            "updated":       datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
            "bankroll":      round(paper.get("virtual_bankroll", 0), 4),
            "start_bankroll":paper.get("start_bankroll", 100),
            "sniper": {
              "n_open":     len(open_t),
              "n_resolved": len(resolved),
              "n_wins":     wins,
              "win_rate":   round(wins/len(resolved)*100, 1) if resolved else 0,
              "total_pnl":  round(sniper.get("total_pnl", 0), 4),
              "no_signal_streak": sniper.get("_review_meta", {}).get("no_signal_streak", 0),
              "open_trades": [
                {"question": t.get("question","")[:80],
                 "side": t.get("side"), "price": t.get("price"),
                 "confidence": t.get("confidence"),
                 "hours_to_expiry": t.get("hours_to_expiry"),
                 "reason": t.get("reason")}
                for t in open_t
              ],
              "recent_resolved": [
                {"question": t.get("question","")[:80],
                 "side": t.get("side"), "won": t.get("outcome"),
                 "pnl": t.get("pnl_usdc"), "confidence": t.get("confidence"),
                 "reason": t.get("reason")}
                for t in sorted(resolved, key=lambda x: x.get("date",""), reverse=True)[:10]
              ],
            }
          }

          content = json.dumps(summary, indent=2, ensure_ascii=False)

          # Commit via GitHub API
          repo    = os.environ["GITHUB_REPOSITORY"]
          branch  = os.environ["DEPLOY_BRANCH"]
          token   = os.environ["GITHUB_TOKEN"]
          api     = f"https://api.github.com/repos/{repo}"
          headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
            "X-GitHub-Api-Version": "2022-11-28",
          }
          path = "performance_snapshot.json"
          url  = f"{api}/contents/{path}?ref={branch}"
          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as r:
                  old = json.loads(r.read())
              sha = old["sha"]
          except: sha = None

          body = {"message": f"perf: daily snapshot {summary['updated']}",
                  "content": base64.b64encode(content.encode()).decode(),
                  "branch": branch}
          if sha: body["sha"] = sha
          req = urllib.request.Request(
              f"{api}/contents/{path}",
              data=json.dumps(body).encode(), headers=headers, method="PUT")
          with urllib.request.urlopen(req, timeout=15) as r:
              print("Snapshot committed:", json.loads(r.read()).get("commit",{}).get("sha",""))
          EOF

  # ── Job 2: Continuous scan (hourly job, internal ~2.5-min loop) ──────────────
  # Visibility-adaptive quota guard:
  #   repo PRIVATE → single scan per hourly tick (~720 billable min/month, safe)
  #   repo PUBLIC  → 55-min internal loop, scan every ~2.5 min (unlimited free)
  # Flip the repo to public and the next hourly run upgrades automatically.
  paper_scan:
    name: "Continuous Paper Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 58
    if: >
      github.event_name == 'schedule' &&
      !startsWith(github.event.schedule, '0 15') &&
      !startsWith(github.event.schedule, '30 0')

    # Never run two scan loops at once; queue at most one successor.
    concurrency:
      group: paper-scan
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r polymarket_bot/requirements.txt -q

      - name: Restore paper trade state
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}
          restore-keys: |
            paper-state-v2-

      - name: Scan markets (loop when public, single when private)
        env:
          PAPER_ESTIMATOR: free
          SEND_DAILY_REPORT: "false"
          MONTHLY_SCAN_LIMIT: "20000"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRIV=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}" \
            | python3 -c "import sys,json; print(str(json.load(sys.stdin).get('private', True)).lower())")
          echo "repo private=$PRIV"
          cd polymarket_bot
          if [ "$PRIV" = "true" ]; then
            echo "Quota guard: single scan (make repo public for continuous mode)"
            python run_paper_trade.py
          else
            echo "Continuous mode: scanning every ~2.5 min for 55 min"
            END=$(( $(date +%s) + 3300 ))
            while [ "$(date +%s)" -lt "$END" ]; do
              python run_paper_trade.py || true
              # The inter-scan gap doubles as a Telegram command listener,
              # so /summary gets answered within seconds.
              python telegram_commands.py --listen 150 || sleep 150
            done
          fi

      - name: Save paper trade state
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}

  # ── Job 3: Daily strategy review (00:30 UTC = 08:30 Taiwan) ─────────────────
  strategy_review:
    name: "Daily Strategy Review"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_review == 'yes') ||
      (github.event_name == 'schedule' &&
       startsWith(github.event.schedule, '30 0'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r polymarket_bot/requirements.txt -q

      - name: Restore trade state
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}
          restore-keys: |
            paper-state-v2-

      - name: Run strategy review (auto-tune + Telegram report)
        env:
          REVIEWER_USE_CLAUDE: "true"
          REVIEWER_AUTO_PR: "true"
          REVIEWER_AUTO_MERGE: "true"
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd polymarket_bot
          python reviewer.py

      - name: Save trade state
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            polymarket_bot/paper_trades.json
            polymarket_bot/grid_trades.json
            polymarket_bot/sniper_trades.json
          key: paper-state-v2-${{ github.run_id }}

